services:
  mongodb:
    image: mongo:latest
    container_name: invoice_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - invoice_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    container_name: invoice_ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - invoice_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build: .
    container_name: invoice_backend
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./invoice_slices:/app/invoice_slices
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - HF_HOME=/root/.cache/huggingface
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - invoice_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: invoice_frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - invoice_net

volumes:
  mongo_data:
  ollama_data:
  hf_cache:
  uploads_data:
  reports_data:
  invoice_slices_data:

networks:
  invoice_net:
    driver: bridge
